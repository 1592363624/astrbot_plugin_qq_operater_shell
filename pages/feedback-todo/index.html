<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>反馈待办管理</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <h1 id="page-title">反馈待办管理</h1>
      <div class="toolbar">
        <div class="filters" id="filters">
          <button data-filter="pending" class="filter-btn active">未完成</button>
          <button data-filter="done" class="filter-btn">已完成</button>
          <button data-filter="all" class="filter-btn">全部</button>
        </div>
        <span id="count-info" class="count-info"></span>
        <button id="refresh-btn" class="btn">刷新</button>
      </div>
      <div class="toolbar" id="batch-bar">
        <span id="selected-count"></span>
        <button id="batch-delete-btn" class="btn danger">删除选中</button>
      </div>
    </header>
    <div id="status-line" class="status-line" hidden></div>
    <main id="list" class="list"></main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
